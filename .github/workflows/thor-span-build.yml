name: Thor Span Perf build

on:
  workflow_dispatch:
  push:
    branches: [ "thor-span-perf" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Dummy credentials
        run: |
          cat <<EOF > local.properties
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          EOF
      - name: Build Span Perf APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleLegacySpanperf 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: |
          grep -nE "error:|^e: |What went wrong|FAILED|Exception|> " build.log | grep -v "^.*> Task" | head -60 > errs.txt || true
          tail -40 build.log >> errs.txt
          split -l 12 errs.txt part_
          for f in part_*; do echo "::error title=$f::$(sed 's/%/%25/g' $f | sed ':a;N;$!ba;s/\n/%0A/g')"; done
      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: span-perf-apk
          path: out/*.apk
          retention-days: 30
